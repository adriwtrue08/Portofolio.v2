<!DOCTYPE html>
<html lang="id">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADRI WIYANTO - About</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"

<body class="bg-slate-950 text-slate-100 antialiased font-sans flex flex-col min-h-screen justify-between">

    <div id="navbar-component"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">

        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="glass-panel p-6 rounded-2xl text-center border border-slate-800">

            </div>
            <div class="glass-panel p-6 rounded-2xl text-center border border-slate-800">

                <p class="text-slate-400 text-sm font-medium">Penghargaan</p>
            </div>

    </main>

    <div id="footer-component"></div>
    <script src="main.js"></script>

</html>
