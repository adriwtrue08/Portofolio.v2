<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio/ADRI WIYANTO</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Panggil File Komponen Navbar & Footer -->
    <script src="components.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased font-sans flex flex-col min-h-screen justify-between">

    <!-- NAVBAR AUTOMATIC -->
    <app-header></app-header>

    <!-- MAIN HERO CONTENT -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

            <div class="lg:col-span-7 space-y-6 text-center lg:text-left">

                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                    HAI, SAYA <br>
                    <span id="typing-name"
                        class="text-glow tracking-wide typing-cursor text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500"></span>
                </h1>

                <h2 class="text-xl sm:text-2xl font-semibold text-slate-300">
                    <span class="text-cyan-400">L2</span> IT SUPPORT
                </h2>

                <p class="text-slate-400 text-base sm:text-lg leading-relaxed max-w-2xl mx-auto lg:mx-0">
                    Berfokus pada pembuatan antarmuka digital yang intuitif, modern, dan fungsional. Berpengalaman
                    merancang produk digital berkualitas tinggi untuk memenuhi kebutuhan bisnis dan penggunanya.
                </p>

                <div class="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-4">
                    <a href="assets/CV_Adri_Wiyanto.pdf" download
                        class="group flex items-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-7 py-3.5 rounded-full shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 hover:-translate-y-0.5 transition-all duration-300">
                        <i class="fa-solid fa-download text-lg group-hover:animate-bounce"></i>
                        <span>DOWNLOAD CV</span>
                    </a>

                    <a href="about.html"
                        class="px-7 py-3.5 rounded-full font-semibold text-slate-300 border border-slate-700 hover:border-slate-500 hover:text-white hover:bg-slate-900 transition-all duration-300">
                        LIHAT PROFIL
                    </a>
                </div>
            </div>

            <div class="lg:col-span-5 flex justify-center">
                <div class="relative w-72 h-72 sm:w-80 sm:h-80 lg:w-96 lg:h-96">
                    <div
                        class="absolute inset-0 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-3xl rotate-6 blur-2xl opacity-40 animate-pulse">
                    </div>
                    <div
                        class="relative w-full h-full rounded-3xl overflow-hidden border border-slate-700/80 shadow-2xl glass-panel group">
                        <img src="assets/profile.jpg" alt="Adri Wiyanto"
                            class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"
                            onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=800'">
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER AUTOMATIC -->
    <app-footer></app-footer>

    <script src="main.js"></script>
</body>

</html>
